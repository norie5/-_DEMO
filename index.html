<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>demo</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
            background: #000;

            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            position: fixed;
            inset: 0;
            background: #000;
        }

        #game-frame {
            position: fixed;

            width: 720px;
            height: 1280px;

            left: 0;
            top: 0;

            border: 0;
            margin: 0;
            padding: 0;

            background: #000;

            transform-origin: top left;
        }
    </style>
</head>

<body>
    <iframe
        id="game-frame"
        src="game.html"
        scrolling="no"
        frameborder="0"
        allow="fullscreen; autoplay; gamepad">
    </iframe>

    <script>
        const GAME_WIDTH = 720;
        const GAME_HEIGHT = 1280;

        function getViewport() {
            if (window.visualViewport) {
                return {
                    width: window.visualViewport.width,
                    height: window.visualViewport.height,
                    left: window.visualViewport.offsetLeft,
                    top: window.visualViewport.offsetTop
                };
            }

            return {
                width: window.innerWidth,
                height: window.innerHeight,
                left: 0,
                top: 0
            };
        }

        function resizeFrame() {
            const frame = document.getElementById("game-frame");
            const vp = getViewport();

            const scaleX = vp.width / GAME_WIDTH;
            const scaleY = vp.height / GAME_HEIGHT;

            // 完整显示，不裁切
            const scale = Math.min(scaleX, scaleY);

            const drawW = GAME_WIDTH * scale;
            const drawH = GAME_HEIGHT * scale;

            const left = vp.left + (vp.width - drawW) * 0.5;
            const top = vp.top + (vp.height - drawH) * 0.5;

            frame.style.left = left + "px";
            frame.style.top = top + "px";
            frame.style.transform = "scale(" + scale + ")";
        }

        function forceResize() {
            resizeFrame();

            setTimeout(resizeFrame, 50);
            setTimeout(resizeFrame, 150);
            setTimeout(resizeFrame, 300);
            setTimeout(resizeFrame, 600);
            setTimeout(resizeFrame, 1000);
        }

        window.addEventListener("resize", forceResize);
        window.addEventListener("orientationchange", forceResize);

        if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", forceResize);
            window.visualViewport.addEventListener("scroll", forceResize);
        }

        document.addEventListener("touchmove", function (event) {
            event.preventDefault();
        }, { passive: false });

        document.addEventListener("gesturestart", function (event) {
            event.preventDefault();
        });

        document.addEventListener("gesturechange", function (event) {
            event.preventDefault();
        });

        document.addEventListener("gestureend", function (event) {
            event.preventDefault();
        });

        window.onload = forceResize;
    </script>
</body>
</html>
