<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="utf-8" />

    <meta http-equiv="pragma" content="no-cache" />

    <title>demo</title>

    <style>
        html,
        body {
            background: #000;
            color: #cccccc;
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;

            touch-action: none;
        }

        body {
            background: #000;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;

            -ms-touch-action: none;
            touch-action: none;

            margin: 0;
            padding: 0;
            border: 0;
            background: #000;
        }

        :-webkit-full-screen #canvas {
            width: 100%;
            height: 100%;
        }

        :-webkit-full-screen {
            width: 100%;
            height: 100%;
        }

        div.gm4html5_div_class {
            margin: 0;
            padding: 0;
            border: 0;
            background: #000;
        }

        div.gm4html5_login {
            padding: 20px;
            position: absolute;
            border: solid 2px #000000;
            background-color: #404040;
            color: #00ff00;
            border-radius: 15px;
            box-shadow: #101010 20px 20px 40px;
        }

        div.gm4html5_cancel_button {
            float: right;
        }

        div.gm4html5_login_button {
            float: left;
        }

        div.gm4html5_login_header {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="gm4html5_div_class" id="gm4html5_div_id">
        <canvas id="canvas" width="720" height="1280">
            <p>Your browser doesn't support HTML5 canvas.</p>
        </canvas>
    </div>

    <script>
        function loadGameMakerScript() {
            var script = document.createElement("script");

            // 用时间戳避免 GitHub Pages / Safari 缓存旧 demo.js
            script.src = "html5game/demo.js?v=" + Date.now();

            script.onload = function () {
                if (typeof GameMaker_Init === "function") {
                    GameMaker_Init();
                } else {
                    console.error("GameMaker_Init is not defined.");
                }
            };

            script.onerror = function () {
                console.error("Failed to load html5game/demo.js");
            };

            document.body.appendChild(script);
        }

        document.addEventListener("touchmove", function (event) {
            event.preventDefault();
        }, { passive: false });

        window.onload = function () {
            loadGameMakerScript();
        };
    </script>
</body>

</html>
