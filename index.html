<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta charset="utf-8" />
    <meta http-equiv="pragma" content="no-cache" />

    <title>demo</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #cccccc;

            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        body {
            position: fixed;
            inset: 0;
            background: #000;
        }

        #gm4html5_div_id {
            position: fixed;
            margin: 0;
            padding: 0;
            border: 0;
            background: #000;
            overflow: hidden;
        }

        #canvas {
            display: block;
            margin: 0;
            padding: 0;
            border: 0;
            background: #000;

            image-rendering: pixelated;
            image-rendering: crisp-edges;

            touch-action: none;
            -ms-touch-action: none;
        }

        div.gm4html5_div_class {
            margin: 0;
            padding: 0;
            border: 0;
        }
    </style>
</head>

<body>
    <div class="gm4html5_div_class" id="gm4html5_div_id">
        <canvas id="canvas" width="720" height="1280">
            <p>Your browser doesn't support HTML5 canvas.</p>
        </canvas>
    </div>

    <script>
        const GAME_WIDTH = 720;
        const GAME_HEIGHT = 1280;

        function getViewport() {
            if (window.visualViewport) {
                return {
                    width: window.visualViewport.width,
                    height: window.visualViewport.height,
                    left: window.visualViewport.offsetLeft,
                    top: window.visualViewport.offsetTop
                };
            }

            return {
                width: window.innerWidth,
                height: window.innerHeight,
                left: 0,
                top: 0
            };
        }

        function resizeGame() {
            const vp = getViewport();

            const gameDiv = document.getElementById("gm4html5_div_id");
            const canvas = document.getElementById("canvas");

            const scaleX = vp.width / GAME_WIDTH;
            const scaleY = vp.height / GAME_HEIGHT;

            // contain：完整显示，不裁切
            const scale = Math.min(scaleX, scaleY);

            const drawW = Math.floor(GAME_WIDTH * scale);
            const drawH = Math.floor(GAME_HEIGHT * scale);

            const offsetX = Math.floor(vp.left + (vp.width - drawW) * 0.5);
            const offsetY = Math.floor(vp.top + (vp.height - drawH) * 0.5);

            gameDiv.style.left = offsetX + "px";
            gameDiv.style.top = offsetY + "px";
            gameDiv.style.width = drawW + "px";
            gameDiv.style.height = drawH + "px";

            canvas.style.width = drawW + "px";
            canvas.style.height = drawH + "px";

            // 不改 canvas.width / canvas.height
            // 让 GameMaker 内部仍然保持 720×1280
        }

        function forceResize() {
            resizeGame();

            setTimeout(resizeGame, 100);
            setTimeout(resizeGame, 300);
            setTimeout(resizeGame, 600);
            setTimeout(resizeGame, 1000);
        }

        window.addEventListener("resize", forceResize);
        window.addEventListener("orientationchange", forceResize);

        if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", forceResize);
            window.visualViewport.addEventListener("scroll", forceResize);
        }

        document.addEventListener("touchmove", function (event) {
            event.preventDefault();
        }, { passive: false });

        function loadGame() {
            const script = document.createElement("script");
            script.src = "html5game/demo.js?v=" + Date.now();

            script.onload = function () {
                forceResize();

                if (typeof GameMaker_Init === "function") {
                    GameMaker_Init();
                } else {
                    console.error("GameMaker_Init is not defined.");
                }

                setTimeout(forceResize, 500);
                setTimeout(forceResize, 1200);
            };

            script.onerror = function () {
                console.error("Failed to load html5game/demo.js");
            };

            document.body.appendChild(script);
        }

        window.onload = function () {
            forceResize();
            loadGame();
        };
    </script>
</body>

</html>
